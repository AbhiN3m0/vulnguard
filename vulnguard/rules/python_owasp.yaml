schema_version: 1

rules:

  # ---------------------------------------------------
  # Dangerous eval usage
  # ---------------------------------------------------
  - id: PY-EVAL-001
    language: python
    type: function_call
    name: eval
    message: Dangerous eval usage
    severity: HIGH
    owasp: A03:2021 Injection
    taint_required: true
    argument_index: 0
    sources:
      - input
    sanitizers:
      - ast.literal_eval
    fix: Replace eval() with ast.literal_eval() or safe parsing logic.

  # ---------------------------------------------------
  # SQL Injection (sqlite / generic DB cursor)
  # ---------------------------------------------------
  - id: PY-SQLI-001
    language: python
    type: function_call
    name: cursor.execute
    message: Possible SQL Injection
    severity: HIGH
    owasp: A03:2021 Injection
    taint_required: true
    argument_index: 0
    detect_sql_string: true
    sources:
      - input
    sanitizers:
      - int
      - float
      - str
    fix: Use parameterized queries instead of string concatenation.

  # ---------------------------------------------------
  # Unsafe Deserialization (pickle)
  # ---------------------------------------------------
  - id: PY-DESERIALIZE-001
    language: python
    type: function_call
    name: pickle.loads
    message: Potential unsafe deserialization
    severity: HIGH
    owasp: A08:2021 Software and Data Integrity Failures
    taint_required: true
    argument_index: 0
    sources:
      - input
    fix: Avoid loading untrusted pickle data. Use safe formats like JSON.

  # ---------------------------------------------------
  # Weak Hash (MD5)
  # ---------------------------------------------------
  - id: PY-CRYPTO-001
    language: python
    type: function_call
    name: hashlib.md5
    message: Weak cryptographic hash (MD5)
    severity: MEDIUM
    owasp: A02:2021 Cryptographic Failures
    taint_required: false
    argument_index: 0
    fix: Use SHA-256 or stronger hashing algorithm.

