name: VulnGuard Scan

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  vulnguard:
    runs-on: ubuntu-latest

    permissions:
      security-events: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install VulnGuard
        run: |
          python -m pip install --upgrade pip
          pip install typer pyyaml
          pip install .

      - name: Run VulnGuard
        run: |
	vulnguard . --sarif-output || true
      - name: Upload SARIF file
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: vulnguard-report.sarif

