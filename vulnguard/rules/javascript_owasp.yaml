schema_version: 1

rules:

  - id: JS-EVAL-001
    name: Dangerous eval usage
    language: javascript
    severity: HIGH
    owasp: A03:2021 Injection
    recommendation: Avoid eval(); use safe parsing methods.

  - id: JS-DOCUMENT-WRITE-002
    name: document.write usage
    language: javascript
    severity: MEDIUM
    owasp: A03:2021 Injection
    recommendation: Avoid document.write; use safe DOM APIs.

  - id: JS-INNERHTML-001
    name: innerHTML assignment
    language: javascript
    severity: HIGH
    owasp: A03:2021 Injection
    recommendation: Avoid unsafe DOM injection; use textContent or sanitization.
